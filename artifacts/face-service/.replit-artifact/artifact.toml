kind = "api"
previewPath = "/face-api"
title = "Face Embedding Service"
version = "1.0.0"

[[services]]
localPort = 8001
name = "Face Embedding Service"
paths = ["/face-api"]

[services.development]
run = "bash start.sh"

[services.development.env]
PORT = "8001"

[services.production]

[services.production.run]
args = ["bash", "start.sh"]

[services.production.run.env]
PORT = "8001"

[services.production.health.startup]
path = "/health"
