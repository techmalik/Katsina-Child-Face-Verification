kind = "web"
  previewPath = "/"
  title = "Child Verification Platform"
  version = "1.0.0"
  id = "artifacts/verification-app"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 5173

  [services.development]
  run = "pnpm --filter @workspace/verification-app run dev"

  [services.production]
  serve = "static"
  publicDir = "artifacts/verification-app/dist/public"

  [services.env]
  PORT = "5173"
  BASE_PATH = "/"
