kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Starts the Python face embedding service on port 8001 in the background,
# waits up to 60 s for it to be ready, then exec's into the Node API server.
args = ["bash", "artifacts/face-service/start-with-api.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
FACE_SERVICE_URL = "http://localhost:8001"
FACE_SERVICE_PORT = "8001"

[services.production.health.startup]
path = "/api/healthz"
